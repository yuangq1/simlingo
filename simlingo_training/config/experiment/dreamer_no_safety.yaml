# @package _global_
# Dreamer-only, instruction-following mode (NO safety)
defaults:
  - /data_module: carla_no_buckets
  - /model/vision_model: vlm
  - /data_module/base_dataset: dataset

model:
  lr: 3e-5
  predict_route_as_wps: True
  speed_wps_mode: 2d
  language_model:
    variant: 'OpenGVLab/InternVL2-1B'
    lora: True
    lora_alpha: 64
    lora_r: 32
    lora_dropout: 0.1
  vision_model:
    variant: 'OpenGVLab/InternVL2-1B'

data_module:
  batch_size: 2
  num_workers: 4
  driving_dataset: null          # only dreamer data
  base_dataset:
    data_path: database/simlingo
    bucket_path: database/simlingo/buckets_paths.pkl
    pred_len: 11
    cut_bottom_quarter: True
    use_commentary: False
    use_qa: False
    qa_augmentation: False
    img_shift_augmentation: True
    img_shift_augmentation_prob: 0.5
    hist_len: 1
    route_as: target_point_command
    use_lmdrive_commands: True
    use_old_towns: True
    use_town13: True
    use_safety_flag: False       # ★ 关闭安全模式，纯指令跟随

max_epochs: 5
val_every_n_epochs: 1
gpus: 1
seed: 42
name: dreamer_no_safety
debug: true

hydra:
  run:
    dir: outputs/${wandb_name}_${name}
